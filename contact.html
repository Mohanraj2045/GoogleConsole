<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Search Appearance for questions about Bing-ready static sites and Netlify deployment." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://search-appearance.netlify.app/contact" />
  <title>Search Appearance | Contact</title>
  <link rel="stylesheet" href="assets/css/styles.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ContactPage",
        "@id": "https://search-appearance.netlify.app/contact",
        "url": "https://search-appearance.netlify.app/contact",
        "name": "Search Appearance | Contact",
        "description": "Contact Search Appearance for questions about Bing-ready static sites and Netlify deployment.",
        "isPartOf": { "@type": "WebSite", "url": "https://search-appearance.netlify.app/" },
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://search-appearance.netlify.app/" },
            { "@type": "ListItem", "position": 2, "name": "Contact", "item": "https://search-appearance.netlify.app/contact" }
          ]
        }
      }
    ]
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Search Appearance</h1>
      <nav aria-label="Main navigation">
        <a href="/" data-nav="home">Home</a>
        <a href="/about" data-nav="about">About</a>
        <a href="/services" data-nav="services">Services</a>
        <a href="/contact" data-nav="contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Contact</h2>
      <p>Email: hello@example.com</p>
      <p>Phone: +1 555 0100</p>
      <p>Address: 123 Demo Street, Placeholder City</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Built for Netlify demo deployment.</div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
